<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Child Protection Case Registry</title>
<style>
  :root{
    --ink: #1C2B2A;
    --paper: #F5F6F3;
    --paper-raised: #FFFFFF;
    --line: #D8DCD6;
    --navy: #1E3A4C;
    --navy-deep: #142833;
    --gold: #B8862E;
    --red: #A23E2E;
    --amber: #B8862E;
    --green: #3C6E4F;
    --muted: #5C6B68;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    line-height: 1.5;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  #app{ max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }

  header.site{
    padding: 28px 0 18px;
    border-bottom: 2px solid var(--navy);
    margin-bottom: 22px;
  }
  header.site .top-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  }
  header.site h1{
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--navy-deep);
    letter-spacing: 0.2px;
  }
  header.site p.tagline{
    margin:0; color: var(--muted); font-size: 14.5px; max-width: 46ch;
  }
  .session-box{ text-align:right; font-family:inherit; }
  .session-box .who{ font-size: 14px; color: var(--navy-deep); font-weight:600; }
  .session-box button{ margin-top:6px; }

  .notice{
    background: #FBF6EA;
    border: 1px solid #E4D6AD;
    border-left: 4px solid var(--gold);
    padding: 12px 16px;
    font-size: 13.5px;
    color: #4A3C1A;
    margin-bottom: 26px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .notice strong{ color: #3A2E12; }

  button{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    cursor: pointer;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    padding: 9px 16px;
    font-size: 14px;
    border-radius: 3px;
    transition: background 0.15s ease;
  }
  button:hover{ background: var(--navy-deep); }
  button.ghost{
    background: transparent; color: var(--navy); border: 1px solid var(--line);
  }
  button.ghost:hover{ background: #EDEFEA; }
  button.small{ padding: 5px 10px; font-size: 12.5px; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  input, textarea, select{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 14.5px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline: 2px solid var(--navy); outline-offset: 1px;
  }
  label{
    display:block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; text-transform: none; color: var(--muted); margin-bottom: 4px; margin-top: 14px;
  }
  label:first-child{ margin-top:0; }
  .field-error{ color: var(--red); font-size: 12.5px; margin-top: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }

  .auth-tabs{ display:flex; gap: 4px; margin-bottom: 18px; }
  .auth-tabs button{
    background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 8px 4px; margin-right: 18px; font-size: 15px;
  }
  .auth-tabs button.active{ color: var(--navy-deep); border-bottom-color: var(--gold); font-weight: 600; }
  .auth-tabs button:hover{ background: transparent; color: var(--navy-deep); }

  .panel{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 22px;
    max-width: 420px;
  }

  nav.tabs{
    display:flex; gap: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  nav.tabs button{
    background:transparent; color: var(--muted); border:none; border-bottom: 2px solid transparent;
    border-radius:0; padding: 10px 2px; font-size: 14.5px;
  }
  nav.tabs button.active{ color: var(--navy-deep); border-bottom-color: var(--navy); font-weight:600; }
  nav.tabs button:hover{ background:transparent; color:var(--navy-deep); }

  h2.section-title{
    font-size: 19px; color: var(--navy-deep); margin: 0 0 16px; font-weight:600;
  }

  .case-list{ list-style:none; margin:0; padding:0; }
  .case-item{
    border: 1px solid var(--line);
    border-left: 5px solid var(--muted);
    background: var(--paper-raised);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .case-item.status-open{ border-left-color: var(--red); }
  .case-item.status-review{ border-left-color: var(--gold); }
  .case-item.status-resolved{ border-left-color: var(--green); }

  .case-top{ display:flex; justify-content:space-between; gap: 14px; align-items:flex-start; }
  .case-title{ font-size: 17px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .case-meta{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px; color: var(--muted);
  }
  .status-pill{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11.5px; padding: 3px 9px; border-radius: 10px; white-space:nowrap; font-weight:600;
  }
  .status-open .status-pill{ background:#F4E1DB; color:#7A2E20; }
  .status-review .status-pill{ background:#F3E9D2; color:#7A5C15; }
  .status-resolved .status-pill{ background:#DCEADF; color:#28502F; }

  .case-desc{ margin: 10px 0 12px; font-size: 14.5px; color: #333; }
  .case-official{ font-size: 13.5px; color: var(--navy-deep); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; margin-bottom: 10px; }
  .case-official b{ font-weight:600; }

  .rating-row{
    display:flex; align-items:center; justify-content:space-between; gap: 14px;
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .rating-score{
    display:flex; align-items:baseline; gap:6px;
  }
  .rating-score .num{ font-size: 22px; font-weight:700; }
  .rating-score .of{ font-size: 12px; color: var(--muted); }
  .rating-score .count{ font-size: 11.5px; color: var(--muted); }
  .rating-red .num{ color: var(--red); }
  .rating-amber .num{ color: var(--amber); }
  .rating-green .num{ color: var(--green); }
  .rating-none .num{ color: var(--muted); }

  .my-rating{ display:flex; align-items:center; gap:8px; }
  .my-rating select{ width: 76px; padding: 6px 8px; font-size: 13px; }
  .my-rating button{ padding: 6px 12px; font-size: 12.5px; }

  .empty-state{
    border: 1px dashed var(--line); padding: 28px 20px; text-align:center; color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px;
  }

  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--navy-deep); color:#fff; padding: 10px 18px; border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 13.5px; opacity:0; pointer-events:none; transition: opacity 0.25s ease;
    z-index: 50;
  }
  .toast.show{ opacity:1; }

  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; color: var(--muted); }
  .checkbox-row input{ width:auto; }

  .anon-badge{ font-style: italic; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  window.addEventListener('error', function(e){
    console.error('Uncaught error:', e.error || e.message);
    showToast('Error: ' + (e.message || 'something went wrong'));
  });
  window.addEventListener('unhandledrejection', function(e){
    console.error('Unhandled rejection:', e.reason);
    showToast('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  let session = null; // { username }
  let currentAuthTab = 'login';
  let currentTab = 'report';
  let cases = [];
  let loading = true;
  let authError = '';

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  // Self-contained hash (no dependency on crypto.subtle, which is not
  // reliably available inside sandboxed artifact iframes). This is NOT
  // cryptographically secure — fine for this demo, not for a real system.
  async function sha256(text){
    let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
    for (let i = 0; i < text.length; i++){
      const ch = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    const combined = (h1 >>> 0).toString(16).padStart(8,'0') + (h2 >>> 0).toString(16).padStart(8,'0');
    return combined;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function ratingBucket(avg){
    if (avg === null) return 'none';
    if (avg < 5) return 'red';
    if (avg <= 8) return 'amber';
    return 'green'; // 9-10
  }

  function avgRating(c){
    if (!c.ratings || c.ratings.length === 0) return null;
    const sum = c.ratings.reduce((a,r)=>a+r.value,0);
    return sum / c.ratings.length;
  }

  // In-memory fallback store, used only if window.storage is missing or
  // throws at the moment of a call. Data in the fallback does NOT persist
  // across reloads — usingFallback tracks whether we've had to use it.
  const memoryStore = {};
  let usingFallback = false;

  function hasStorage(){
    return typeof window.storage === 'object' && window.storage !== null
      && typeof window.storage.get === 'function'
      && typeof window.storage.set === 'function';
  }

  async function dGet(key, shared){
    const fullKey = (shared ? 'shared:' : 'priv:') + key;
    if (hasStorage()){
      try{
        const res = await window.storage.get(key, shared);
        return res ? res.value : null;
      }catch(e){
        // real storage throws on missing keys too — check fallback, else null
      }
    } else {
      usingFallback = true;
    }
    return Object.prototype.hasOwnProperty.call(memoryStore, fullKey) ? memoryStore[fullKey] : null;
  }

  async function dSet(key, value, shared){
    const fullKey = (shared ? 'shared:' : 'priv:') + key;
    memoryStore[fullKey] = value; // always mirror to fallback so the session stays consistent
    if (hasStorage()){
      try{
        await window.storage.set(key, value, shared);
        return true;
      }catch(e){
        console.error('window.storage.set failed, using in-memory fallback:', e);
        usingFallback = true;
        return false;
      }
    }
    usingFallback = true;
    return false;
  }

  async function dList(prefix, shared){
    const tag = shared ? 'shared:' : 'priv:';
    let keys = [];
    if (hasStorage()){
      try{
        const res = await window.storage.list(prefix, shared);
        keys = (res && res.keys) ? res.keys : [];
        return keys;
      }catch(e){
        console.error('window.storage.list failed, using in-memory fallback:', e);
        usingFallback = true;
      }
    } else {
      usingFallback = true;
    }
    // fallback: derive keys from memoryStore
    return Object.keys(memoryStore)
      .filter(k => k.startsWith(tag + prefix))
      .map(k => k.slice(tag.length));
  }

  async function loadCases(){
    const keys = await dList('cases:', true);
    const loaded = [];
    for (const k of keys){
      try{
        const val = await dGet(k, true);
        if (val) loaded.push(JSON.parse(val));
      }catch(e){ /* skip unreadable entry */ }
    }
    loaded.sort((a,b)=> b.createdAt - a.createdAt);
    cases = loaded;
  }

  async function saveCase(c){
    return await dSet('cases:' + c.id, JSON.stringify(c), true);
  }

  async function findUser(username){
    const val = await dGet('users:' + username.toLowerCase(), true);
    return val ? JSON.parse(val) : null;
  }

  async function saveUser(u){
    return await dSet('users:' + u.username.toLowerCase(), JSON.stringify(u), true);
  }

  // ---------- Render ----------

  function render(){
    if (loading){
      app.innerHTML = '<p class="sans" style="padding-top:60px;color:var(--muted);">Loading…</p>';
      return;
    }
    app.innerHTML = '';
    app.appendChild(renderHeader());
    app.appendChild(renderNotice());

    if (usingFallback){
      const err = document.createElement('div');
      err.className = 'notice';
      err.style.borderLeftColor = 'var(--red)';
      err.innerHTML = '<strong>Running without persistent storage.</strong> This browser session did not keep a connection to the storage API, so data is being held in memory only for now and will be lost on reload. The app still works normally for this session.';
      app.appendChild(err);
    }

    if (!session){
      app.appendChild(renderAuth());
    } else {
      app.appendChild(renderTabs());
      const content = document.createElement('div');
      if (currentTab === 'report') content.appendChild(renderReportForm());
      else content.appendChild(renderCaseList());
      app.appendChild(content);
    }
  }

  function renderHeader(){
    const header = document.createElement('header');
    header.className = 'site';
    header.innerHTML = `
      <div class="top-row">
        <div>
          <h1>Child Protection Case Registry</h1>
          <p class="tagline">A public log for tracking how reported cases are being handled, and for rating the responsiveness of the officials assigned to them.</p>
        </div>
        <div class="session-box sans">
          ${session ? `<div class="who">${escapeHtml(session.username)}</div><button class="ghost small" id="logout-btn">Log out</button>` : ''}
        </div>
      </div>
    `;
    if (session){
      header.querySelector('#logout-btn').addEventListener('click', ()=>{
        session = null;
        currentTab = 'report';
        render();
      });
    }
    return header;
  }

  function renderNotice(){
    const div = document.createElement('div');
    div.className = 'notice';
    div.innerHTML = `<strong>This is a demonstration tool, not an emergency service.</strong> If a child is in immediate danger, contact your local emergency number right away. In the US, you can also reach the Childhelp National Child Abuse Hotline at 1-800-422-4453, available 24/7. Data entered here is stored only in this browser and is not sent to any government agency or database.`;
    return div;
  }

  // ---------- Auth ----------

  function renderAuth(){
    const wrap = document.createElement('div');

    const tabs = document.createElement('div');
    tabs.className = 'auth-tabs sans';
    tabs.innerHTML = `
      <button class="${currentAuthTab==='login'?'active':''}" id="tab-login">Log in</button>
      <button class="${currentAuthTab==='register'?'active':''}" id="tab-register">Register</button>
    `;
    tabs.querySelector('#tab-login').addEventListener('click', ()=>{ currentAuthTab='login'; authError=''; render(); });
    tabs.querySelector('#tab-register').addEventListener('click', ()=>{ currentAuthTab='register'; authError=''; render(); });
    wrap.appendChild(tabs);

    const panel = document.createElement('div');
    panel.className = 'panel';

    if (currentAuthTab === 'login'){
      panel.innerHTML = `
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" />
        ${authError ? `<div class="field-error">${escapeHtml(authError)}</div>` : ''}
        <div style="margin-top:18px;"><button id="login-submit">Log in</button></div>
      `;
      panel.querySelector('#login-submit').addEventListener('click', onLoginSubmit);
      panel.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('keydown', e=>{ if (e.key==='Enter') onLoginSubmit(); });
      });
    } else {
      panel.innerHTML = `
        <label for="reg-username">Choose a username</label>
        <input id="reg-username" type="text" autocomplete="username" />
        <label for="reg-password">Choose a password</label>
        <input id="reg-password" type="password" autocomplete="new-password" />
        <label for="reg-password2">Confirm password</label>
        <input id="reg-password2" type="password" autocomplete="new-password" />
        ${authError ? `<div class="field-error">${escapeHtml(authError)}</div>` : ''}
        <div style="margin-top:18px;"><button id="reg-submit">Create account</button></div>
      `;
      panel.querySelector('#reg-submit').addEventListener('click', onRegisterSubmit);
      panel.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('keydown', e=>{ if (e.key==='Enter') onRegisterSubmit(); });
      });
    }

    wrap.appendChild(panel);
    return wrap;
  }

  async function onLoginSubmit(){
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password){
      authError = 'Enter both a username and password.';
      render();
      return;
    }
    try{
      const user = await findUser(username);
      if (!user){
        authError = 'No account found with that username.';
        render();
        return;
      }
      const hash = await sha256(password);
      if (hash !== user.passwordHash){
        authError = 'Incorrect password.';
        render();
        return;
      }
      session = { username: user.username };
      authError = '';
      currentTab = 'report';
      render();
      showToast('Logged in as ' + user.username);
    }catch(e){
      authError = 'Something went wrong logging in: ' + (e && e.message ? e.message : e);
      render();
    }
  }

  async function onRegisterSubmit(){
    console.log('Register clicked');
    try{
      const usernameEl = document.getElementById('reg-username');
      const passwordEl = document.getElementById('reg-password');
      const password2El = document.getElementById('reg-password2');
      if (!usernameEl || !passwordEl || !password2El){
        authError = 'Form did not load correctly. Please reload.';
        render();
        return;
      }
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      const password2 = password2El.value;

      if (!username || username.length < 3){
        authError = 'Username must be at least 3 characters.'; render(); return;
      }
      if (!/^[a-zA-Z0-9_\-]+$/.test(username)){
        authError = 'Username can only contain letters, numbers, - and _.'; render(); return;
      }
      if (!password || password.length < 6){
        authError = 'Password must be at least 6 characters.'; render(); return;
      }
      if (password !== password2){
        authError = 'Passwords do not match.'; render(); return;
      }

      console.log('Checking for existing user:', username);
      const existing = await findUser(username);
      console.log('Existing user check result:', existing);
      if (existing){
        authError = 'That username is already taken.'; render(); return;
      }
      const passwordHash = await sha256(password);
      console.log('Password hashed, saving user...');
      const user = { username, passwordHash, createdAt: Date.now() };
      const saveResult = await saveUser(user);
      console.log('Save result:', saveResult);
      session = { username: user.username };
      authError = '';
      currentTab = 'report';
      render();
      showToast('Account created. Welcome, ' + user.username + '.');
    }catch(e){
      console.error('Registration failed:', e);
      authError = 'Something went wrong creating the account: ' + (e && e.message ? e.message : String(e));
      render();
    }
  }

  // ---------- Tabs ----------

  function renderTabs(){
    const nav = document.createElement('nav');
    nav.className = 'tabs sans';
    nav.innerHTML = `
      <button class="${currentTab==='report'?'active':''}" id="nav-report">Report a case</button>
      <button class="${currentTab==='browse'?'active':''}" id="nav-browse">All cases (${cases.length})</button>
    `;
    nav.querySelector('#nav-report').addEventListener('click', ()=>{ currentTab='report'; render(); });
    nav.querySelector('#nav-browse').addEventListener('click', ()=>{ currentTab='browse'; render(); });
    return nav;
  }

  // ---------- Report form ----------

  let formError = '';

  function renderReportForm(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<h2 class="section-title">Report a case</h2>`;

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.maxWidth = '560px';
    panel.innerHTML = `
      <label for="f-title">Case title</label>
      <input id="f-title" type="text" placeholder="Short summary, e.g. Unfollowed-up referral, Lincoln Elementary" />

      <label for="f-desc">What happened, and what needs attention</label>
      <textarea id="f-desc" rows="5" placeholder="Describe the situation and what response you expect from the responsible agency."></textarea>

      <label for="f-official">Official or agency responsible for the case</label>
      <input id="f-official" type="text" placeholder="Name, title, or department" />

      <label for="f-status">Current status</label>
      <select id="f-status">
        <option value="open">Open — no meaningful response yet</option>
        <option value="review">Under review — official is engaged</option>
        <option value="resolved">Resolved</option>
      </select>

      <div class="checkbox-row">
        <input type="checkbox" id="f-anon" />
        <label for="f-anon" style="margin:0;">Report anonymously (your username will not be shown on this case)</label>
      </div>

      ${formError ? `<div class="field-error">${escapeHtml(formError)}</div>` : ''}

      <div style="margin-top:18px;"><button id="f-submit">Submit report</button></div>
    `;
    panel.querySelector('#f-submit').addEventListener('click', onReportSubmit);
    wrap.appendChild(panel);
    return wrap;
  }

  async function onReportSubmit(){
    const title = document.getElementById('f-title').value.trim();
    const description = document.getElementById('f-desc').value.trim();
    const official = document.getElementById('f-official').value.trim();
    const status = document.getElementById('f-status').value;
    const anon = document.getElementById('f-anon').checked;

    if (!title || !description || !official){
      formError = 'Please fill in the title, description, and responsible official.';
      render();
      return;
    }

    const c = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
      title, description, official, status,
      reporter: anon ? null : session.username,
      createdAt: Date.now(),
      ratings: []
    };
    await saveCase(c);
    await loadCases();
    formError = '';
    currentTab = 'browse';
    render();
    showToast('Case reported.');
  }

  // ---------- Browse / rate ----------

  function renderCaseList(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `<h2 class="section-title">All reported cases</h2>`;

    if (cases.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No cases have been reported yet. Use "Report a case" to add the first one.';
      wrap.appendChild(empty);
      return wrap;
    }

    const ul = document.createElement('ul');
    ul.className = 'case-list';

    cases.forEach(c=>{
      const li = document.createElement('li');
      li.className = 'case-item status-' + c.status;

      const avg = avgRating(c);
      const bucket = ratingBucket(avg);
      const myExisting = c.ratings.find(r => r.username === session.username);

      const statusLabel = c.status === 'open' ? 'Open' : c.status === 'review' ? 'Under review' : 'Resolved';
      const dateStr = new Date(c.createdAt).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      const reporterStr = c.reporter ? escapeHtml(c.reporter) : '<span class="anon-badge">anonymous</span>';

      li.innerHTML = `
        <div class="case-top">
          <div>
            <p class="case-title">${escapeHtml(c.title)}</p>
            <p class="case-meta">Reported by ${reporterStr} on ${dateStr}</p>
          </div>
          <span class="status-pill">${statusLabel}</span>
        </div>
        <p class="case-desc">${escapeHtml(c.description)}</p>
        <p class="case-official">Responsible: <b>${escapeHtml(c.official)}</b></p>
        <div class="rating-row">
          <div class="rating-score rating-${bucket}">
            <span class="num">${avg === null ? '—' : avg.toFixed(1)}</span>
            <span class="of">/ 10</span>
            <span class="count">${c.ratings.length} rating${c.ratings.length===1?'':'s'}</span>
          </div>
          <div class="my-rating">
            <select id="rate-${c.id}">
              ${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}" ${myExisting && myExisting.value===n ? 'selected':''}>${n}</option>`).join('')}
            </select>
            <button class="small" id="rate-btn-${c.id}">${myExisting ? 'Update my rating' : 'Rate handling'}</button>
          </div>
        </div>
      `;

      li.querySelector('#rate-btn-' + c.id).addEventListener('click', async ()=>{
        const val = parseInt(document.getElementById('rate-' + c.id).value, 10);
        await submitRating(c.id, val);
      });

      ul.appendChild(li);
    });

    wrap.appendChild(ul);
    return wrap;
  }

  async function submitRating(caseId, value){
    const c = cases.find(x => x.id === caseId);
    if (!c) return;
    const existingIdx = c.ratings.findIndex(r => r.username === session.username);
    const entry = { username: session.username, value, ts: Date.now() };
    if (existingIdx >= 0) c.ratings[existingIdx] = entry;
    else c.ratings.push(entry);
    await saveCase(c);
    await loadCases();
    render();
    showToast('Rating saved.');
  }

  // ---------- Init ----------

  async function init(){
    loading = true;
    render();
    try{
      await loadCases();
    }catch(e){
      console.error('loadCases failed:', e);
    }
    loading = false;
    render();
  }

  init();
})();
</script>
</body>
</html>
