<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Child Abuse Management System</title>
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F4; --ink:#14263A; --muted:#566878; --line:#D5DEE6;
  --primary:#0F6B6B; --primary-ink:#FFFFFF; --accent:#F0B429; --accent-ink:#3A2A00; --danger:#B23A3A;
  --s-reported:#2F62A0; --s-review:#9A6412; --s-assigned:#0F6B6B; --s-hold:#6F4FA0; --s-closed:#2A7748; --s-rejected:#B23A3A;
  --p-low:#566878; --p-medium:#2F62A0; --p-high:#9A6412; --p-urgent:#B23A3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A26; --surface:#15263A; --surface-2:#1B3049; --ink:#E6EEF5; --muted:#9DB0C2; --line:#28405A;
    --primary:#3FB6B0; --primary-ink:#06222A; --accent:#F0B429; --accent-ink:#3A2A00; --danger:#F08080;
    --s-reported:#7FB0EA; --s-review:#E0A94A; --s-assigned:#4CC2BC; --s-hold:#B79BE3; --s-closed:#63C088; --s-rejected:#F08080;
    --p-low:#9DB0C2; --p-medium:#7FB0EA; --p-high:#E0A94A; --p-urgent:#F08080;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A26; --surface:#15263A; --surface-2:#1B3049; --ink:#E6EEF5; --muted:#9DB0C2; --line:#28405A;
  --primary:#3FB6B0; --primary-ink:#06222A; --accent:#F0B429; --accent-ink:#3A2A00; --danger:#F08080;
  --s-reported:#7FB0EA; --s-review:#E0A94A; --s-assigned:#4CC2BC; --s-hold:#B79BE3; --s-closed:#63C088; --s-rejected:#F08080;
  --p-low:#9DB0C2; --p-medium:#7FB0EA; --p-high:#E0A94A; --p-urgent:#F08080;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;line-height:1.55;
}
h1,h2,h3{line-height:1.2;margin:0;font-weight:700}
h1{font-size:1.9rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.wrap{max-width:1040px;margin:0 auto;padding-left:20px;padding-right:20px}
.page{padding-top:28px;padding-bottom:64px;display:grid;gap:20px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand .sub{font-weight:400;color:var(--muted);font-size:.8rem;display:block}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .name{font-weight:700}
.role{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.role-admin{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.role-officer{background:color-mix(in srgb,var(--primary) 16%,transparent);border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.count{background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:700;border-radius:999px;padding:0 8px;min-width:22px;text-align:center}

/* controls */
.btn{font:inherit;font-weight:700;padding:.55rem 1rem;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:.25rem .75rem;font-size:.9rem}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--muted);border-radius:8px;
  padding:.6rem .75rem;width:100%;min-height:44px;
}
textarea{resize:vertical;min-height:88px}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline select,.inline input{flex:1 1 200px;width:auto}
.err{color:var(--danger);font-weight:700;min-height:1.4em;margin-top:10px}
.hint{font-size:.875rem;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.pwrow{position:relative}
.pwrow input{padding-right:70px}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--primary);font-weight:700;font-size:.85rem;cursor:pointer;padding:6px 8px;min-height:0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px;align-content:start}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:10px;padding:10px 14px;font-size:.92rem}
.banner.warn{background:color-mix(in srgb,var(--danger) 16%,var(--surface));border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.banner.ok{background:color-mix(in srgb,var(--s-closed) 16%,var(--surface));border-color:color-mix(in srgb,var(--s-closed) 45%,var(--line))}
.empty{border:1px dashed var(--muted);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.notice{border:1px dashed color-mix(in srgb,var(--danger) 55%,var(--line));border-radius:10px;padding:10px 14px;font-size:.85rem;color:var(--muted)}
.notice b{color:var(--danger)}

/* pills and status */
.pill{display:inline-block;font-size:.85rem;font-weight:700;padding:2px 12px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
.st-reported{--c:var(--s-reported)}
.st-review{--c:var(--s-review)}
.st-assigned{--c:var(--s-assigned)}
.st-hold{--c:var(--s-hold)}
.st-closed{--c:var(--s-closed)}
.st-rejected{--c:var(--s-rejected)}
.pr-low{--c:var(--p-low)} .pr-medium{--c:var(--p-medium)} .pr-high{--c:var(--p-high)} .pr-urgent{--c:var(--p-urgent)}

/* segmented + chips */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:.4rem .9rem;border-radius:7px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.3rem .85rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .n{font-size:1.7rem;font-weight:700}
.stat .l{color:var(--muted);font-size:.85rem}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
.bartrack{background:var(--surface-2);border-radius:6px;height:10px;overflow:hidden}
.barfill{height:100%;background:var(--primary);border-radius:6px}

/* case rows */
.list{display:grid;gap:10px}
.row{font:inherit;text-align:left;color:inherit;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;align-items:center}
.row:hover{border-color:var(--primary)}
.row-main{display:grid;gap:2px;min-width:0}
.row-num{color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.02em}
.row-title{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.row-meta{color:var(--muted);font-size:.9rem}
.row-side{display:grid;gap:6px;justify-items:end;flex:none}

/* stepper */
.steps{list-style:none;margin:0;padding:0;display:flex}
.steps li{flex:1;display:grid;justify-items:center;gap:6px;text-align:center;font-size:.85rem;color:var(--muted);position:relative}
.steps li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.steps li:first-child::before{display:none}
.steps .dot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--primary);border-color:var(--primary)}
.steps li.done::before,.steps li.cur::before{background:var(--primary)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur .dot{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 25%,transparent)}
.steps li.paused .dot{border-color:var(--s-hold);box-shadow:0 0 0 4px color-mix(in srgb,var(--s-hold) 25%,transparent)}

/* details */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fact dt{font-size:.85rem;color:var(--muted)}
.fact dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{border-left:3px solid var(--line);padding-left:12px}
.entry{border-left:3px solid var(--primary);padding:2px 0 2px 12px}
.entry .meta{font-size:.85rem;color:var(--muted)}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}

/* feedback */
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars button{font:inherit;font-weight:700;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.stars button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stars button:hover{border-color:var(--primary)}
.fbscore{font-size:1.6rem;font-weight:700}

/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - 40px);padding-top:32px;padding-bottom:40px}
.auth h1{font-size:2.2rem;margin:18px 0 12px}
.auth .lead{font-size:1.1rem;max-width:38ch}
.tabs{display:flex;gap:6px;margin-bottom:6px}

/* staff / people */
.people{display:grid;gap:8px}
.person{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.person-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.status-badge{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.status-active{color:var(--s-closed);border-color:color-mix(in srgb,var(--s-closed) 45%,var(--line))}
.status-disabled{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .auth{grid-template-columns:1fr;gap:20px;min-height:0}
  .auth h1{font-size:1.8rem}
  .two{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  h1{font-size:1.6rem}
  .row{flex-direction:column;align-items:flex-start}
  .row-side{justify-items:start;grid-auto-flow:column;align-items:center}
  .steps li{font-size:.72rem}
  .barrow{grid-template-columns:100px 1fr 30px;font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

// ===============================
// STORAGE MANAGEMENT
// ===============================
var P = 'cpcr2_'; // unchanged from the previous version so existing browser data is not orphaned
var mem = {};
var storageStatus = 'full'; // 'full' | 'idb-only' | 'none'

var store = {
  get: function(k, d){
    try { var v = localStorage.getItem(P + k); return v === null ? d : JSON.parse(v); }
    catch(e){ return (k in mem) ? mem[k] : d; }
  },
  set: function(k, v){
    mem[k] = v;
    try { localStorage.setItem(P + k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  },
  remove: function(k){
    delete mem[k];
    try { localStorage.removeItem(P + k); } catch(e){}
  }
};

var dbp = null;
function timeout(ms){ return new Promise(function(r){ setTimeout(function(){ r(undefined); }, ms); }); }
function db(){
  if(!dbp) dbp = new Promise(function(res){
    try {
      var r = indexedDB.open('cpcr2', 1); // unchanged from the previous version so existing snapshots are not orphaned
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ res(null); };
    } catch(e){ res(null); }
  });
  return dbp;
}
var idb = {
  get: function(k){
    return Promise.race([db().then(function(d){
      if(!d) return undefined;
      return new Promise(function(res){
        try { var q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ res(undefined); }; }
        catch(e){ res(undefined); }
      });
    }), timeout(1500)]);
  },
  set: function(k, v){
    return Promise.race([db().then(function(d){
      if(!d) return false;
      return new Promise(function(res){
        try { var t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = function(){ res(true); }; t.onerror = function(){ res(false); }; }
        catch(e){ res(false); }
      });
    }), timeout(1500)]);
  }
};
function mirror(){ idb.set('snapshot', { users: users, cases: cases, session: store.get('session', null), ts: Date.now() }); }

function validArr(a){ return Array.isArray(a); }

async function load(){
  var lsUsers = store.get('users', null);
  var lsCases = store.get('cases', null);
  if(validArr(lsUsers) && lsUsers.length && validArr(lsCases)){
    users = lsUsers; cases = lsCases;
    storageStatus = (storageStatus === 'none') ? 'idb-only' : storageStatus;
    return;
  }
  // localStorage missing or malformed: try the IndexedDB snapshot before giving up
  var snap = await idb.get('snapshot');
  if(snap && validArr(snap.users) && snap.users.length && validArr(snap.cases)){
    users = snap.users; cases = snap.cases;
    store.set('users', users); store.set('cases', cases);
    if(snap.session) store.set('session', snap.session);
    return;
  }
  users = []; cases = [];
}
function save(){
  var a = store.set('users', users), b = store.set('cases', cases);
  var probeOk = (function(){ try { localStorage.setItem(P + 'probe', '1'); localStorage.removeItem(P + 'probe'); return true; } catch(e){ return false; } })();
  idb.set('snapshot', { users: users, cases: cases, session: store.get('session', null), ts: Date.now() }).then(function(ok){
    storageStatus = probeOk ? 'full' : (ok ? 'idb-only' : 'none');
  });
  if(!probeOk) storageStatus = 'idb-only';
}

// migrate old/incomplete case records so nothing crashes and nothing is lost
function nextCaseNumber(){
  var max = 0;
  cases.forEach(function(c){
    var m = /^CASE-(\d+)$/.exec(c.caseNumber || '');
    if(m){ var n = parseInt(m[1], 10); if(n > max) max = n; }
  });
  return 'CASE-' + String(max + 1).padStart(4, '0');
}
function migrateCases(){
  var changed = false;
  cases.forEach(function(c){
    if(!c.caseNumber || cases.filter(function(x){ return x.caseNumber === c.caseNumber; }).length > 1){ c.caseNumber = nextCaseNumber(); changed = true; }
    if(!c.priority) { c.priority = 'Medium'; changed = true; }
    if(!c.abuseType) { c.abuseType = 'Other'; changed = true; }
    if(c.age == null) { c.age = ''; changed = true; }
    if(!c.gender) { c.gender = ''; changed = true; }
    if(!c.incidentLocation) { c.incidentLocation = ''; changed = true; }
    if(!c.incidentDate) { c.incidentDate = ''; changed = true; }
    if(!c.incidentTime) { c.incidentTime = ''; changed = true; }
    if(!c.status || !SLUG[c.status]) { c.status = 'Reported'; changed = true; }
    if(!validArr(c.history)) { c.history = []; changed = true; }
    if(!validArr(c.logs)) { c.logs = []; changed = true; }
    if(c.feedback === undefined) { c.feedback = null; changed = true; }
    if(c.closureNote === undefined) { c.closureNote = ''; changed = true; }
    if(c.holdResumeDate === undefined) { c.holdResumeDate = ''; changed = true; }
    if(c.rejectReason === undefined) { c.rejectReason = ''; changed = true; }
  });
  if(changed) save();
}

// ===============================
// APP STATE
// ===============================
var users = [], cases = [], me = null;
var ui = { view:'dashboard', scope:'mine', state:'all', abuseFilter:'all', prioFilter:'all', officerFilter:'all', q:'',
  caseId:null, from:'cases', auth:'login', editing:false,
  confirmClose:false, confirmReset:false, confirmImport:null, confirmReject:false,
  pendingReport:null, resetPwFor:null };
var STEPS = ['Reported','Under review','Assigned','Closed'];
var SLUG = { 'Reported':'reported', 'Under review':'review', 'Assigned':'assigned', 'On hold':'hold', 'Rejected':'rejected', 'Closed':'closed' };
var ROLE = { user:'Regular user', officer:'Case officer', admin:'Admin' };
var ABUSE_TYPES = ['Physical Abuse','Sexual Abuse','Emotional / Psychological Abuse','Neglect','Child Exploitation','Other'];
var PRIORITIES = ['Low','Medium','High','Urgent'];
var RELATIONSHIPS = ['Parent','Guardian','Relative','Teacher','Neighbour','Friend','Professional','Other'];
var FEEDBACK_LABELS = { 1:'Very Poor', 2:'Poor', 3:'Fair', 4:'Good', 5:'Very Good' };

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
function fmt(ts){
  if(!ts) return '—';
  try { return new Date(ts).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }); }
  catch(e){ return new Date(ts).toString(); }
}
function userById(id){ return users.filter(function(u){ return u.id === id; })[0] || null; }
function nameOf(id){ var u = userById(id); return u ? u.name : 'Unknown user'; }

// ===============================
// AUTHENTICATION
// ===============================
async function hash(u, p){
  if(!(window.crypto && window.crypto.subtle)) throw new Error('no-crypto');
  var s = u.toLowerCase() + ':' + p;
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
}
var toastTimer;
function toast(s){
  var el = document.getElementById('toast');
  el.textContent = s; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

async function boot(){
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch(e){}
  await load();
  if(!users.length){
    try {
      users.push({ id: uid(), name:'System Admin', username:'admin', pass: await hash('admin','admin123'),
        role:'admin', status:'active', email:'', phone:'', relationship:'', createdAt: Date.now() });
      save();
    } catch(e){ toast('This browser cannot create secure accounts. Try a modern browser.'); }
  } else {
    migrateCases();
  }
  var sid = store.get('session', null);
  me = userById(sid);
  if(me && me.status === 'disabled'){ me = null; store.remove('session'); }
  if(me) resetUi();
  render();
}

window.addEventListener('storage', function(e){
  if(!e.key || e.key.indexOf(P) !== 0) return;
  var t = document.activeElement && document.activeElement.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  load().then(function(){ if(me) me = userById(me.id); render(); });
});

// ===============================
// CASE MANAGEMENT — permissions & helpers
// ===============================
function isStaff(){ return me && (me.role === 'admin' || me.role === 'officer'); }
function canFull(c){ return me.role === 'admin' || c.reporterId === me.id || c.assigneeId === me.id; }
function isHandler(c){ return me.role === 'admin' || c.assigneeId === me.id; }
function canRate(c){ return c.reporterId === me.id && c.assigneeId !== me.id; }
function defaultScope(){ return me.role === 'admin' ? 'all' : (me.role === 'officer' ? 'assigned' : 'mine'); }
function resetUi(){
  ui.view = 'dashboard'; ui.scope = defaultScope(); ui.state = 'all'; ui.abuseFilter = 'all'; ui.prioFilter = 'all'; ui.officerFilter = 'all'; ui.q = '';
  ui.caseId = null; ui.editing = false; ui.confirmClose = false; ui.confirmReset = false; ui.confirmImport = null;
  ui.confirmReject = false; ui.pendingReport = null; ui.resetPwFor = null;
}
function go(view, extra){
  ui.view = view; ui.confirmClose = false; ui.confirmReset = false; ui.confirmImport = null; ui.confirmReject = false; ui.editing = false;
  if(extra){ for(var k in extra) ui[k] = extra[k]; }
  render(); window.scrollTo(0, 0);
}
function accessibleCases(){
  if(me.role === 'admin') return cases.slice();
  return cases.filter(function(c){ return c.reporterId === me.id || c.assigneeId === me.id; });
}

// ===============================
// UI RENDERING
// ===============================
function render(){
  var app = document.getElementById('app');
  if(!me){ app.innerHTML = authView(); return; }
  var body = '';
  if(ui.view === 'report') body = reportView();
  else if(ui.view === 'closed') body = closedView();
  else if(ui.view === 'staff' && me.role === 'admin') body = staffView();
  else if(ui.view === 'backup' && me.role === 'admin') body = backupView();
  else if(ui.view === 'profile') body = profileView();
  else if(ui.view === 'case') body = caseView();
  else if(ui.view === 'cases') body = casesView();
  else body = dashboardView();
  var band = '';
  if(storageStatus === 'idb-only') band = '<div class="wrap" style="padding-top:14px"><div class="banner">Primary browser storage is unavailable. Backup browser storage is being used, so your data should still be here next time.</div></div>';
  else if(storageStatus === 'none') band = '<div class="wrap" style="padding-top:14px"><div class="banner warn">Browser storage is unavailable. Changes may not persist after reload — use Export backup on the Backup &amp; Restore page.</div></div>';
  app.innerHTML = topbar() + band + body;
  if(ui.view === 'cases') renderList();
  else if(ui.view === 'closed') renderClosedList();
}

function topbar(){
  var newCount = me.role === 'admin' ? cases.filter(function(c){ return c.status === 'Reported'; }).length : 0;
  function nb(v, label, extra){
    var cur = (ui.view === v || (ui.view === 'case' && ui.from === v)) ? ' aria-current="page"' : '';
    return '<button data-action="nav" data-v="' + v + '"' + cur + '>' + label + (extra || '') + '</button>';
  }
  var items = nb('dashboard', 'Dashboard');
  if(me.role === 'admin') items += nb('cases', 'All cases', newCount ? '<span class="count" title="Reports waiting for review">' + newCount + '</span>' : '');
  else if(me.role === 'officer') items += nb('cases', 'My cases');
  else items += nb('cases', 'My cases');
  if(me.role !== 'officer') items += nb('report', 'Report a case');
  items += nb('closed', 'Closed cases');
  if(me.role === 'admin'){ items += nb('staff', 'Staff accounts'); items += nb('backup', 'Backup &amp; restore'); }
  items += nb('profile', 'Profile');
  return '<header class="topbar"><div class="wrap bar">' +
    '<div class="brand"><span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>' +
    '<span>Child Abuse Management System<span class="sub">Academic prototype — browser-only demo</span></span></div>' +
    '<div class="who"><span class="name">' + esc(me.name) + '</span><span class="role role-' + me.role + '">' + ROLE[me.role] + '</span>' +
    '<button class="btn ghost sm" data-action="logout">Log out</button></div></div>' +
    '<nav class="wrap nav" aria-label="Main">' + items + '</nav></header>';
}

function pwField(id, name, label, required, autoc){
  return '<label for="' + id + '">' + label + '</label><div class="pwrow"><input id="' + id + '" name="' + name + '" type="password" autocomplete="' + autoc + '"' + (required ? ' required' : '') + '>' +

/* ----- dashboard ----- */
function statCard(n, l){ return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>'; }
function breakdown(list, keyFn, keys, title){
  var counts = {}; keys.forEach(function(k){ counts[k] = 0; });
  list.forEach(function(c){ var k = keyFn(c); if(counts[k] === undefined) counts[k] = 0; counts[k]++; });
  var max = Math.max.apply(null, keys.map(function(k){ return counts[k]; }).concat([1]));
  return '<div class="card"><h2>' + esc(title) + '</h2><div class="bars">' + keys.map(function(k){
    var n = counts[k];
    return '<div class="barrow"><span class="small">' + esc(k) + '</span><span class="bartrack"><span class="barfill" style="width:' + (n / max * 100) + '%"></span></span><span class="small" style="text-align:right">' + n + '</span></div>';
  }).join('') + '</div></div>';
}
function dashboardView(){
  var mine = accessibleCases();
  var h = '<main class="wrap page"><h1>Dashboard</h1>';
  if(me.role === 'admin'){
    var all = cases;
    h += '<div class="stats">' +
      statCard(all.length, 'Total cases') +
      statCard(all.filter(function(c){ return c.status === 'Reported'; }).length, 'New reports') +
      statCard(all.filter(function(c){ return c.status === 'Under review'; }).length, 'Under review') +
      statCard(all.filter(function(c){ return c.status === 'Assigned'; }).length, 'Assigned') +
      statCard(all.filter(function(c){ return c.status === 'On hold'; }).length, 'On hold') +
      statCard(all.filter(function(c){ return c.status === 'Closed'; }).length, 'Closed') +
      statCard(users.filter(function(u){ return u.role === 'officer'; }).length, 'Total officers') +
      statCard(users.filter(function(u){ return u.role === 'user'; }).length, 'Total users') + '</div>';
  } else if(me.role === 'officer'){
    var assigned = cases.filter(function(c){ return c.assigneeId === me.id; });
    h += '<div class="stats">' +
      statCard(assigned.length, 'Assigned to me') +
      statCard(assigned.filter(function(c){ return c.status === 'Under review'; }).length, 'Under review') +
      statCard(assigned.filter(function(c){ return c.status === 'On hold'; }).length, 'On hold') +
      statCard(assigned.filter(function(c){ return c.status === 'Closed'; }).length, 'Closed') + '</div>';
  } else {
    var own = cases.filter(function(c){ return c.reporterId === me.id; });
    h += '<div class="stats">' +
      statCard(own.length, 'My reported cases') +
      statCard(own.filter(function(c){ return c.status !== 'Closed' && c.status !== 'Rejected'; }).length, 'My open cases') +
      statCard(own.filter(function(c){ return c.status === 'Closed'; }).length, 'My closed cases') + '</div>';
  }
  if(mine.length){
    h += '<div class="two">' +
      breakdown(mine, function(c){ return c.abuseType || 'Other'; }, ABUSE_TYPES, 'Cases by abuse type') +
      breakdown(mine, function(c){ return c.priority || 'Medium'; }, PRIORITIES, 'Cases by priority') + '</div>';
  } else {
    h += '<div class="empty">No case data to summarize yet.</div>';
  }
  return h + '</main>';
}

/* ----- cases list ----- */
function scopesFor(){
  if(me.role === 'admin') return [['all','All cases'],['assigned','Assigned to me'],['mine','My reports']];
  if(me.role === 'officer') return [['assigned','Assigned to me'],['mine','My reports']];
  return [];
}
function scopeCases(){
  if(ui.scope === 'all' && me.role === 'admin') return cases.slice();
  if(ui.scope === 'assigned') return cases.filter(function(c){ return c.assigneeId === me.id; });
  return cases.filter(function(c){ return c.reporterId === me.id; });
}
function officerOptions(){
  return users.filter(function(u){ return u.role === 'officer' || u.role === 'admin'; });
}
function casesView(){
  var sc = scopesFor();
  var seg = sc.length > 1 ? '<div class="seg" role="group" aria-label="Which cases">' + sc.map(function(s){
    return '<button data-action="scope" data-v="' + s[0] + '" aria-pressed="' + (ui.scope === s[0]) + '">' + s[1] + '</button>';
  }).join('') + '</div>' : '';
  var officerSelect = me.role === 'admin' ? '<div><label for="fo">Assigned officer</label><select id="fo" data-filter="officer"><option value="all">Any</option>' +
    officerOptions().map(function(u){ return '<option value="' + u.id + '"' + (ui.officerFilter === u.id ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join('') + '</select></div>' : '';
  return '<main class="wrap page"><div class="pagehead"><h1>' + (me.role === 'admin' ? 'All cases' : 'My cases') + '</h1>' +
    (me.role !== 'officer' ? '<button class="btn primary" data-action="nav" data-v="report">Report a case</button>' : '') + '</div>' + seg +
    '<div class="filters">' +
    '<div><label for="q" style="margin-top:0">Search</label><input type="search" id="q" placeholder="Case number, title, child, type, location" value="' + esc(ui.q) + '"></div>' +
    '<div><label for="fa">Abuse type</label><select id="fa" data-filter="abuse"><option value="all">Any</option>' + ABUSE_TYPES.map(function(t){ return '<option value="' + t + '"' + (ui.abuseFilter === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="fp">Priority</label><select id="fp" data-filter="priority"><option value="all">Any</option>' + PRIORITIES.map(function(t){ return '<option value="' + t + '"' + (ui.prioFilter === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    officerSelect + '</div>' +
    '<div id="listwrap" style="display:grid;gap:16px"></div></main>';
}
function priorityPill(c){ return '<span class="pill pr-' + c.priority.toLowerCase() + '">' + esc(c.priority) + '</span>'; }
function caseRow(c){
  var meta = 'Child: ' + esc(c.childName) + '. ' + esc(c.abuseType) + '. Reported by ' + esc(nameOf(c.reporterId)) + ' on ' + fmt(c.createdAt) + '.' +
    (c.assigneeId ? ' Handled by ' + esc(nameOf(c.assigneeId)) + '.' : '');
  return '<button class="row" data-action="open" data-id="' + c.id + '" data-from="cases"><span class="row-main">' +
    '<span class="row-num">' + esc(c.caseNumber) + '</span><span class="row-title">' + esc(c.title) + '</span><span class="row-meta">' + meta + '</span></span>' +
    '<span class="row-side">' + priorityPill(c) + statusPill(c.status) + '</span></button>';
}
function statusPill(status){ return '<span class="pill st-' + SLUG[status] + '">' + esc(status) + '</span>'; }
function matchesFilters(c, q){
  if(ui.abuseFilter !== 'all' && c.abuseType !== ui.abuseFilter) return false;
  if(ui.prioFilter !== 'all' && c.priority !== ui.prioFilter) return false;
  if(ui.officerFilter !== 'all' && c.assigneeId !== ui.officerFilter) return false;
  if(q){
    var hay = (c.caseNumber + ' ' + c.title + ' ' + c.childName + ' ' + c.abuseType + ' ' + c.incidentLocation).toLowerCase();
    if(hay.indexOf(q) === -1) return false;
  }
  return true;
}
function renderList(){
  var el = document.getElementById('listwrap'); if(!el) return;
  var base = scopeCases();
  var q = ui.q.trim().toLowerCase().replace(/\s+/g, ' ');
  var filtered = base.filter(function(c){ return matchesFilters(c, q); });
  var chips = [['all','All (' + filtered.length + ')']].concat(['Reported','Under review','Assigned','On hold','Rejected','Closed'].map(function(s){
    return [s, s + ' (' + filtered.filter(function(c){ return c.status === s; }).length + ')'];
  }));
  var shown = ui.state === 'all' ? filtered : filtered.filter(function(c){ return c.status === ui.state; });
  shown.sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  var empty;
  if(!shown.length){
    empty = '<div class="empty">' + (base.length ?
      'No cases match your search or filters.' :
      (ui.scope === 'mine' ? 'You have not reported any cases yet. Use “Report a case” to start one.' :
       ui.scope === 'assigned' ? 'No cases are assigned to you yet.' : 'No cases have been reported yet.')) + '</div>';
  }
  el.innerHTML = '<div class="chips" role="group" aria-label="Filter by state">' + chips.map(function(c){
    return '<button class="chip" data-action="filter" data-v="' + esc(c[0]) + '" aria-pressed="' + (ui.state === c[0]) + '">' + esc(c[1]) + '</button>';
  }).join('') + '</div>' + (empty || '<div class="list">' + shown.map(caseRow).join('') + '</div>');
}

    '<label for="d">Description — what did you see?</label><textarea id="d" name="desc" rows="7" maxlength="5000" placeholder="What happened, in your own words." required>' + esc(v('description')) + '</textarea></div>';
}

/* ----- closed cases (scoped by role — see fix in section 21 of the spec) ----- */
function closedScope(){
  if(me.role === 'admin') return cases.filter(function(c){ return c.status === 'Closed'; });
  if(me.role === 'officer') return cases.filter(function(c){ return c.status === 'Closed' && c.assigneeId === me.id; });
  return cases.filter(function(c){ return c.status === 'Closed' && c.reporterId === me.id; });
}
function closedView(){
  return '<main class="wrap page"><div><h1>Closed cases</h1><p class="muted" style="margin-top:6px">' +
    (me.role === 'admin' ? 'Every case that has been closed.' : me.role === 'officer' ? 'Cases you handled that have been closed.' : 'Cases you reported that have been closed. Only you can leave feedback on your own case.') +
    '</p></div><div class="filters"><div><label for="q" style="margin-top:0">Search</label><input type="search" id="q" placeholder="Case number, title, child, type, location" value="' + esc(ui.q) + '"></div></div>' +
    '<div id="closedlistwrap"></div></main>';
}
function renderClosedList(){
  var el = document.getElementById('closedlistwrap'); if(!el) return;
  var q = (ui.q || '').trim().toLowerCase().replace(/\s+/g, ' ');
  var list = closedScope().filter(function(c){
    if(!q) return true;
    var hay = (c.caseNumber + ' ' + c.title + ' ' + c.childName + ' ' + c.abuseType + ' ' + c.incidentLocation).toLowerCase();
    return hay.indexOf(q) > -1;
  }).sort(function(a,b){ return (b.closedAt||0) - (a.closedAt||0); });
  var rows = list.map(function(c){
    var fb = c.feedback;
    return '<button class="row" data-action="open" data-id="' + c.id + '" data-from="closed"><span class="row-main">' +
      '<span class="row-num">' + esc(c.caseNumber) + '</span><span class="row-title">' + esc(c.title) + '</span>' +
      '<span class="row-meta">Closed ' + fmt(c.closedAt || c.updatedAt) + (c.assigneeId ? ' by ' + esc(nameOf(c.assigneeId)) : '') + '</span></span>' +
      '<span class="row-side">' + (fb ? '<span class="pill st-closed">' + fb.rating + '/5 — ' + esc(FEEDBACK_LABELS[fb.rating]) + '</span>' : '<span class="muted small">No feedback yet</span>') + '</span></button>';
  }).join('');
  el.innerHTML = rows ? '<div class="list">' + rows + '</div>' : '<div class="empty">No closed cases to show yet.</div>';
}

/* ----- case detail ----- */
function blurb(c){
  var who = c.assigneeId ? esc(nameOf(c.assigneeId)) : 'someone';
  switch(c.status){
    case 'Reported': return 'This report has been received. An admin has not looked at it yet.';
    case 'Under review': return 'An admin has seen this report and is checking that it is accurate. It is not assigned to anyone yet.';
    case 'Assigned': return 'This case is being handled by ' + who + '.';
    case 'On hold': return 'This case is paused because there is an issue to sort out first.';
    case 'Rejected': return 'This report was reviewed and marked invalid or rejected.';
    default: return 'This case has been handled.';
  }
}
function allowed(c){
  var tx = [], assign = false;
  if(me.role === 'admin'){
    if(c.status === 'Reported'){ tx.push({k:'review', l:'Mark under review', p:1}); tx.push({k:'hold', l:'Put on hold'}); tx.push({k:'reject', l:'Reject / mark invalid'}); }
    if(c.status === 'Under review'){ assign = true; tx.push({k:'hold', l:'Put on hold'}); tx.push({k:'reject', l:'Reject / mark invalid'}); }
    if(c.status === 'Assigned'){ assign = true; tx.push({k:'close', l:'Close case', p:1}); tx.push({k:'hold', l:'Put on hold'}); }
    if(c.status === 'On hold'){ tx.push({k:'resume', l:'Resume case', p:1}); }
  } else if(c.assigneeId === me.id){
    if(c.status === 'Assigned'){ tx.push({k:'close', l:'Close case', p:1}); tx.push({k:'hold', l:'Put on hold'}); }
    if(c.status === 'On hold' && c.heldFrom === 'Assigned'){ tx.push({k:'resume', l:'Resume case', p:1}); }
  }
  return { tx: tx, assign: assign };
}
function actionsCard(c){

        '<div class="btnrow"><span class="muted">Closing is final and opens the case for the reporter to leave feedback.</span>' +

    } else if(ui.confirmReject){

    } else {

      if(a.tx.some(function(t){ return t.k === 'hold'; })){

// ===============================
// CASE MANAGEMENT — actions
// ===============================
function addHistory(c, text, note){
  c.history.push({ ts: Date.now(), by: me.id, text: text, note: note || '' });
  c.updatedAt = Date.now();
}
function actNote(){ var e = document.getElementById('actnote'); return e ? e.value.trim() : ''; }

function doTx(c, k){
  var a = allowed(c);
  var ok = a.tx.some(function(t){ return t.k === k || (k === 'close-confirmed' && t.k === 'close') || (k === 'reject-confirmed' && t.k === 'reject'); });
  if(!ok){ toast('You cannot make that change.'); return; }
  if(k === 'review'){
    c.status = 'Under review'; addHistory(c, 'Marked under review', actNote());
  } else if(k === 'hold'){
    var note = actNote();
    if(!note){ toast('Add a note before putting the case on hold.'); return; }
    var resumeEl = document.getElementById('holdresume');
    c.heldFrom = c.status; c.status = 'On hold'; c.holdNote = note; c.holdResumeDate = resumeEl ? resumeEl.value : '';
    addHistory(c, 'Put on hold', note);
  } else if(k === 'resume'){
    var back = c.heldFrom || 'Under review';
    c.status = back; c.heldFrom = null; c.holdNote = ''; c.holdResumeDate = ''; addHistory(c, 'Resumed, back to ' + back, actNote());
  } else if(k === 'reject'){
    ui.confirmReject = true; render(); return;
  } else if(k === 'reject-confirmed'){
    var rn = document.getElementById('rejnote'); var rv = rn ? rn.value.trim() : '';
    if(!rv){ toast('A reason is required to reject a case.'); return; }
    c.status = 'Rejected'; c.rejectReason = rv; addHistory(c, 'Rejected / marked invalid', rv); ui.confirmReject = false;
  } else if(k === 'close'){
    ui.confirmClose = true; render(); return;
  } else if(k === 'close-confirmed'){
    var cn = document.getElementById('closenote'); var cv = cn ? cn.value.trim() : '';
    if(!cv){ toast('A closure note is required to close a case.'); return; }
    c.status = 'Closed'; c.closedAt = Date.now(); c.closureNote = cv;
    addHistory(c, 'Closed', cv); ui.confirmClose = false;
  }
  save(); render(); toast('Case updated.');
}
function doAssign(c){
  var a = allowed(c);
  if(!a.assign){ toast('You cannot assign this case right now.'); return; }
  var sel = document.getElementById('assignsel');
  var target = userById(sel && sel.value);
  if(!target || target.role === 'user'){ toast('Choose a case officer or admin.'); return; }
  var was = c.assigneeId;
  c.assigneeId = target.id; c.status = 'Assigned'; c.assignedAt = Date.now();
  addHistory(c, (was ? 'Reassigned to ' : 'Assigned to ') + target.name, actNote());
  save(); render(); toast('Case assigned to ' + target.name + '.');
}
function findDuplicate(reporterId, title, child){
  var t = title.trim().toLowerCase(), cn = child.trim().toLowerCase();
  return cases.filter(function(c){ return c.reporterId === reporterId && c.title.trim().toLowerCase() === t && c.childName.trim().toLowerCase() === cn; })[0] || null;
}
function readReportForm(f){
  return {
    title: f.title.value.trim(), childName: f.child.value.trim(), age: f.age.value,
    gender: f.gender.value, abuseType: f.abuseType.value, priority: f.priority.value || 'Medium',
    incidentDate: f.incidentDate.value, incidentTime: f.incidentTime.value,
    incidentLocation: f.incidentLocation.value.trim(), description: f.desc.value.trim()
  };
}
function validateReport(v){
  if(!v.title || !v.childName || !v.abuseType || !v.incidentDate || !v.incidentLocation || !v.description) return 'Please fill in every required field.';
  var age = parseInt(v.age, 10);
  if(isNaN(age) || age < 0 || age > 17) return 'Enter a child age between 0 and 17.';
  return null;
}
function createCase(v){
  var now = Date.now();
  var nc = { id: uid(), caseNumber: nextCaseNumber(), title: v.title, childName: v.childName, age: v.age, gender: v.gender,
    abuseType: v.abuseType, priority: v.priority, incidentDate: v.incidentDate, incidentTime: v.incidentTime,
    incidentLocation: v.incidentLocation, description: v.description,
    reporterId: me.id, status: 'Reported', assigneeId: null, assignedAt: null, heldFrom: null, holdNote: '', holdResumeDate: '',
    rejectReason: '', createdAt: now, updatedAt: now, closedAt: null, closureNote: '',
    history: [{ ts: now, by: me.id, text: 'Case reported', note: '' }], logs: [], feedback: null };
  cases.push(nc); save();
  ui.scope = 'mine'; ui.state = 'all'; ui.q = '';
  go('case', { caseId: nc.id, from: 'cases' }); toast('Case reported. An admin will review it.');
}

// ===============================
// EVENTS
// ===============================
document.addEventListener('click', async function(e){
  var t = e.target.closest('[data-action]'); if(!t) return;
  var a = t.getAttribute('data-action');
  var c = ui.caseId ? cases.filter(function(x){ return x.id === ui.caseId; })[0] : null;

  if(a === 'togglepw'){
    var el = document.getElementById(t.getAttribute('data-target'));
    if(el){ var show = el.type === 'password'; el.type = show ? 'text' : 'password'; t.textContent = show ? 'Hide' : 'Show'; }
  }
  else if(a === 'authtab'){ ui.auth = t.getAttribute('data-v'); render(); }
  else if(a === 'nav'){ go(t.getAttribute('data-v'), { caseId: null }); }
  else if(a === 'logout'){ store.remove('session'); mirror(); me = null; ui.auth = 'login'; render(); window.scrollTo(0,0); }
  else if(a === 'scope'){ ui.scope = t.getAttribute('data-v'); ui.state = 'all'; render(); }
  else if(a === 'filter'){ ui.state = t.getAttribute('data-v'); renderList(); }
  else if(a === 'open'){ go('case', { caseId: t.getAttribute('data-id'), from: t.getAttribute('data-from') || 'cases' }); }
  else if(a === 'editreport'){ ui.editing = true; render(); window.scrollTo(0,0); }
  else if(a === 'tx' && c){ doTx(c, t.getAttribute('data-k')); }
  else if(a === 'cancelclose'){ ui.confirmClose = false; render(); }
  else if(a === 'cancelreject'){ ui.confirmReject = false; render(); }
  else if(a === 'assign' && c){ doAssign(c); }
  else if(a === 'addlog' && c){
    var box = document.getElementById('lognote'); var v = box ? box.value.trim() : '';
    if(!isHandler(c) || c.status === 'Closed' || c.status === 'Rejected'){ toast('You cannot add a log entry here.'); return; }
    if(!v){ toast('Write something before adding the entry.'); return; }
    c.logs = c.logs || []; c.logs.push({ id: uid(), ts: Date.now(), by: me.id, text: v });
    c.updatedAt = Date.now(); save(); render(); toast('Log entry added.');
  }
  else if(a === 'pickfb'){ ui.fbPick = parseInt(t.getAttribute('data-n'), 10); render(); }
  else if(a === 'submitfb' && c){
    if(!canRate(c)){ toast('Only the reporter can leave feedback on this case.'); return; }
    if(c.feedback){ toast('Feedback has already been submitted for this case.'); return; }
    if(!ui.fbPick){ toast('Choose a rating from 1 to 5.'); return; }
    var cm = document.getElementById('fbcomment');
    c.feedback = { rating: ui.fbPick, comment: cm ? cm.value.trim() : '', by: me.id, date: Date.now() };
    ui.fbPick = null; save(); render(); toast('Thank you, your feedback has been recorded.');
  }
  else if(a === 'export' && me.role === 'admin'){ exportData(); }
  else if(a === 'cancelimport'){ ui.confirmImport = null; render(); }
  else if(a === 'import-confirmed' && me.role === 'admin' && ui.confirmImport){ applyImport(ui.confirmImport); }
  else if(a === 'togglestatus' && me.role === 'admin'){
    var u = userById(t.getAttribute('data-id'));
    if(!u || u.role === 'user') return;
    if(u.id === me.id){ toast('You cannot disable your own account.'); return; }
    var willDisable = (u.status || 'active') === 'active';
    if(willDisable && u.role === 'admin'){
      var activeAdmins = users.filter(function(x){ return x.role === 'admin' && (x.status || 'active') === 'active'; });
      if(activeAdmins.length <= 1){ toast('At least one active admin account must remain.'); return; }
    }
    u.status = willDisable ? 'disabled' : 'active'; save(); render(); toast(u.name + ' is now ' + u.status + '.');
  }
  else if(a === 'resetpw'){ ui.resetPwFor = t.getAttribute('data-id'); render(); }
  else if(a === 'cancelresetpw'){ ui.resetPwFor = null; render(); }
  else if(a === 'reset'){ ui.confirmReset = true; render(); }
  else if(a === 'cancelreset'){ ui.confirmReset = false; render(); }
  else if(a === 'reset-confirmed' && me.role === 'admin'){
    ['users','cases','session'].forEach(function(k){ store.remove(k); });
    users = []; cases = []; me = null; ui.auth = 'login'; await idb.set('snapshot', null); await boot(); toast('Demo data erased.');
  }
});

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'imp' && me && me.role === 'admin' && e.target.files && e.target.files[0]){ readImportFile(e.target.files[0]); }
  else if(e.target && e.target.hasAttribute && e.target.hasAttribute('data-filter')){
    var kind = e.target.getAttribute('data-filter'), val = e.target.value;
    if(kind === 'abuse') ui.abuseFilter = val;
    else if(kind === 'priority') ui.prioFilter = val;
    else if(kind === 'officer') ui.officerFilter = val;
    renderList();
  }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'q'){ ui.q = e.target.value; if(ui.view === 'cases') renderList(); else if(ui.view === 'closed') renderClosedList(); }
});

// ===============================
// BACKUP / RESTORE
// ===============================
function exportData(){
  var data = { app:'cams', version:2, exportedAt: new Date().toISOString(), users: users, cases: cases };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'child-abuse-mgt-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast('Backup downloaded.');
}
function readImportFile(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if(!d || (d.app !== 'cams' && d.app !== 'cpcr2') || !Array.isArray(d.users) || !Array.isArray(d.cases)) throw new Error('bad');
      var okR = { user:1, officer:1, admin:1 };
      var us = d.users.filter(function(u){ return u && u.id && u.username && u.pass && okR[u.role]; });
      if(!us.some(function(u){ return u.role === 'admin'; })) throw new Error('no admin');
      ui.confirmImport = d; render();
    } catch(e){ toast('That file is not a valid backup.'); }
  };
  r.readAsText(file);
}
function applyImport(d){
  var seen = {}; var us = [];
  d.users.forEach(function(u){ if(u && u.id && !seen[u.id]){ seen[u.id] = 1; if(!u.status) u.status = 'active'; us.push(u); } });
  var seenC = {}; var cs = [];
  d.cases.forEach(function(c){
    if(!c || !c.id || seenC[c.id]) return; seenC[c.id] = 1;
    c.history = Array.isArray(c.history) ? c.history : [];
    c.logs = Array.isArray(c.logs) ? c.logs : [];
    if(c.feedback === undefined) c.feedback = null;
    cs.push(c);
  });
  var myId = me && me.id;
  users = us; cases = cs; migrateCases(); save();
  me = userById(myId);
  ui.confirmImport = null;
  if(!me){ store.remove('session'); mirror(); ui.auth = 'login'; render(); toast('Backup restored. Please log in again.'); return; }
  resetUi(); ui.view = 'backup'; render(); toast('Backup restored.');
}

// ===============================
// FORMS
// ===============================
document.addEventListener('submit', async function(e){
  var f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  var kind = f.getAttribute('data-form');
  function fail(id, msg){ var el = document.getElementById(id); if(el) el.textContent = msg; }
  var okUser = /^[a-z0-9._-]{3,}$/;

  if(kind === 'login'){
    var u = f.username.value.trim().toLowerCase();
    var rec = users.filter(function(x){ return x.username === u; })[0];
    if(rec && (rec.status || 'active') === 'disabled'){ fail('autherr', 'This account has been disabled.'); return; }
    var h;
    try { h = await hash(u, f.password.value); } catch(err){ fail('autherr', 'This browser cannot verify passwords securely. Try a modern browser.'); return; }
    if(!rec || rec.pass !== h){ fail('autherr', 'The username or password is wrong.'); return; }
    me = rec; store.set('session', me.id); mirror(); resetUi(); render(); window.scrollTo(0,0);
  }
  else if(kind === 'register'){
    var name = f.name.value.trim(), un = f.username.value.trim().toLowerCase(), pw = f.password.value, pw2 = f.confirm.value;
    if(!name){ fail('autherr', 'Enter your name.'); return; }
    if(!okUser.test(un)){ fail('autherr', 'Username needs at least 3 letters, numbers, dots, dashes or underscores.'); return; }
    if(pw.length < 8){ fail('autherr', 'Password needs at least 8 characters.'); return; }
    if(pw !== pw2){ fail('autherr', 'Passwords do not match.'); return; }
    await load();
    if(users.some(function(x){ return x.username === un; })){ fail('autherr', 'That username is taken. Choose another.'); return; }
    var nu;
    try { nu = { id: uid(), name: name, username: un, pass: await hash(un, pw), role: 'user', status:'active',
      email: f.email.value.trim(), phone: f.phone.value.trim(), relationship: f.relationship.value, createdAt: Date.now() }; }
    catch(err){ fail('autherr', 'This browser cannot create secure accounts. Try a modern browser.'); return; }
    users.push(nu); save(); me = nu; store.set('session', me.id); mirror(); resetUi(); render(); toast('Welcome, ' + name + '.');
  }
  else if(kind === 'report'){
    var v = readReportForm(f);
    var verr = validateReport(v);
    if(verr){ fail('reperr', verr); return; }
    await load();
    var dupWrap = document.getElementById('dupwrap');
    if(!ui.pendingReport){
      var dup = findDuplicate(me.id, v.title, v.childName);
      if(dup){
        ui.pendingReport = v;
        if(dupWrap) dupWrap.innerHTML = '<div class="banner warn">A similar case already exists (' + esc(dup.caseNumber) + '). Do you want to continue submitting this report?' +
          '<div class="btnrow" style="margin-top:10px"><button type="submit" class="btn danger">Continue and submit anyway</button><button type="button" class="btn" data-action="nav" data-v="cases">Cancel</button></div></div>';
        return;
      }
    }
    ui.pendingReport = null;
    createCase(v);
  }
  else if(kind === 'editreport'){
    var ec = cases.filter(function(x){ return x.id === f.getAttribute('data-id'); })[0];
    if(!ec || ec.reporterId !== me.id || ec.status !== 'Reported'){ fail('editerr', 'This report can no longer be edited.'); return; }
    var ev = readReportForm(f);
    var everr = validateReport(ev);
    if(everr){ fail('editerr', everr); return; }
    for(var k in ev) ec[k] = ev[k];
    ec.updatedAt = Date.now();
    addHistory(ec, 'Report edited by reporter', '');
    save(); ui.editing = false; go('case', { caseId: ec.id, from: ui.from }); toast('Report updated.');
  }
  else if(kind === 'staff' && me.role === 'admin'){
    var sn = f.name.value.trim(), su = f.username.value.trim().toLowerCase(), sp = f.password.value, sp2 = f.confirm.value, sr = f.role.value;
    if(!sn){ fail('stferr', 'Enter the person\'s full name.'); return; }
    if(!okUser.test(su)){ fail('stferr', 'Username needs at least 3 letters, numbers, dots, dashes or underscores.'); return; }
    if(sp.length < 8){ fail('stferr', 'Password needs at least 8 characters.'); return; }
    if(sp !== sp2){ fail('stferr', 'Passwords do not match.'); return; }
    if(sr !== 'officer' && sr !== 'admin'){ fail('stferr', 'Choose an account type.'); return; }
    await load();
    if(users.some(function(x){ return x.username === su; })){ fail('stferr', 'That username is taken. Choose another.'); return; }
    var nsu;
    try { nsu = { id: uid(), name: sn, username: su, pass: await hash(su, sp), role: sr, status:'active', createdAt: Date.now(), createdBy: me.id }; }
    catch(err){ fail('stferr', 'This browser cannot create secure accounts. Try a modern browser.'); return; }
    users.push(nsu); save(); render(); toast(ROLE[sr] + ' account created for ' + sn + '.');
  }
  else if(kind === 'resetpw' && me.role === 'admin'){
    var targetId = f.getAttribute('data-id'); var target = userById(targetId);
    if(!target) return;
    var np = f.newpass.value;
    if(np.length < 8){ toast('Password needs at least 8 characters.'); return; }
    try { target.pass = await hash(target.username, np); } catch(err){ toast('This browser cannot update passwords securely.'); return; }
    ui.resetPwFor = null; save(); render(); toast('Password reset for ' + target.name + '.');
  }
  else if(kind === 'changepw'){
    var cur = f.current.value, nw = f.newpass.value, nw2 = f.confirm.value;
    var curHash; try { curHash = await hash(me.username, cur); } catch(err){ fail('cperr', 'This browser cannot verify passwords securely.'); return; }
    if(curHash !== me.pass){ fail('cperr', 'Your current password is incorrect.'); return; }
    if(nw.length < 8){ fail('cperr', 'New password needs at least 8 characters.'); return; }
    if(nw !== nw2){ fail('cperr', 'New passwords do not match.'); return; }
    try { me.pass = await hash(me.username, nw); } catch(err){ fail('cperr', 'This browser cannot update passwords securely.'); return; }
    save(); render(); toast('Password updated.');
  }
});

boot();
})();
</script>
